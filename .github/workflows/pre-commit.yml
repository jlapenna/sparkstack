name: pre-commit

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout sparkrun
        env:
          # v0.2.36: keep the editable workspace dependency aligned with uv.lock.
          SPARKRUN_REVISION: 872645f32c9967690acd918d00216c6c3272cc84
        run: |
          git init ../sparkrun
          git -C ../sparkrun remote add origin https://github.com/spark-arena/sparkrun.git
          git -C ../sparkrun fetch --depth 1 origin "$SPARKRUN_REVISION"
          git -C ../sparkrun checkout --detach FETCH_HEAD

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Run pre-commit
        uses: tox-dev/action-pre-commit-uv@v1

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      OPENCLAW_CONFIG_DIR: /tmp/sparkstack-openclaw
      SPARKSTACK_CONFIG_PATH: /tmp/sparkstack.yaml
    defaults:
      run:
        working-directory: spark-stack
    steps:
      - name: Checkout spark-stack
        uses: actions/checkout@v7
        with:
          path: spark-stack

      - name: Checkout sparkrun
        uses: actions/checkout@v7
        with:
          repository: spark-arena/sparkrun
          # v0.2.36: keep the editable workspace dependency aligned with uv.lock.
          ref: 872645f32c9967690acd918d00216c6c3272cc84
          path: sparkrun

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "spark-stack/pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run pyright
        run: uv run pyright

      - name: Run unit tests
        run: uv run pytest tests/unit/
